[package]
name = "omastats-sampler"
version = "1.0.0"
edition = "2021"
description = "System sampler for the OmaStats plugin: one JSON line per tick from procfs and sysfs."
license = "MIT"

[[bin]]
name = "omastats-sampler"
path = "src/main.rs"

[dependencies]
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
