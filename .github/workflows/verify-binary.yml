name: Verify bundled Rust binary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_HOME: /tmp/omastats-cargo-home
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: --remap-path-prefix=/tmp/omastats-cargo-home=/cargo-home --remap-path-prefix=${{ github.workspace }}=/source
  SOURCE_DATE_EPOCH: 1788307200

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: archlinux@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6

    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install the dated, signed Arch build environment
        shell: bash
        run: |
          set -euo pipefail
          sed -i '1cServer = https://archive.archlinux.org/repos/2026/09/02/$repo/os/$arch' /etc/pacman.d/mirrorlist
          sed -i '2,$d' /etc/pacman.d/mirrorlist
          pacman -Syy --noconfirm
          pacman -S --noconfirm --needed rust gcc binutils git python
          test "$(pacman -Q rust)" = 'rust 1:1.98.0-1'
          test "$(pacman -Q gcc)" = 'gcc 16.2.1+r23+gd564253eb6c8-1'
          test "$(pacman -Q gcc-libs)" = 'gcc-libs 16.2.1+r23+gd564253eb6c8-1'
          test "$(pacman -Q binutils)" = 'binutils 2.47-4'
          test "$(pacman -Q glibc)" = 'glibc 2.44+r24+g16be1518495f-1'
          test "$(pacman -Q git)" = 'git 2.55.0-1'
          test "$(pacman -Q python)" = 'python 3.14.7-1'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Test and lint the retained source
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path sampler/Cargo.toml --target-dir /tmp/omastats-tests
          cargo clippy --locked --manifest-path sampler/Cargo.toml --target-dir /tmp/omastats-clippy -- -D warnings
          python scripts/test-launcher.py
          python scripts/test-gpu.py
          python scripts/test-disks.py
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          source = Path("sampler.py").read_bytes()
          compile(source, "sampler.py", "exec")
          namespace = {"__name__": "sampler_test", "__file__": "sampler.py"}
          exec(compile(source, "sampler.py", "exec"), namespace)
          bounded = namespace["encode_payload"]({"seq": 7, "blob": "x" * (512 * 1024 + 1)})
          assert len(bounded) <= 512 * 1024 + 1
          assert b"output limit" in bounded
          qml = "\n".join(path.read_text() for path in Path(".").rglob("*.qml"))
          assert '["bash"' not in qml
          service = Path("OmaStatsService.qml").read_text()
          assert "clearEnvironment: true" in service
          assert "Component.onDestruction" in service

          process = subprocess.Popen(
              ["/usr/bin/python3", "-I", "sampler.py", "--python", "--interval", "0.1"],
              env={"LANG": "C.UTF-8", "LC_ALL": "C.UTF-8"},
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          record = process.stdout.readline()
          assert json.loads(record)["seq"] == 0
          process.stdin.write(b"quit\n")
          process.stdin.flush()
          process.wait(timeout=5)
          assert process.returncode == 0
          assert process.stderr.read() == b""
          PY
          python -I sampler.py --python --once | python -c 'import json, sys; raw = sys.stdin.buffer.readline(); payload = json.loads(raw); assert payload["seq"] == 0; assert len(raw) <= 512 * 1024 + 1'

      - name: Rebuild twice and compare with the bundled ELF
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path sampler/Cargo.toml --target-dir /tmp/omastats-build-a
          cargo build --release --locked --manifest-path sampler/Cargo.toml --target-dir /tmp/omastats-build-b
          cmp --silent /tmp/omastats-build-a/release/omastats-sampler /tmp/omastats-build-b/release/omastats-sampler
          cmp --silent /tmp/omastats-build-a/release/omastats-sampler bin/omastats-sampler
          sha256sum --check --strict bin/omastats-sampler.sha256
          /tmp/omastats-build-a/release/omastats-sampler --once | python -c 'import json, sys; raw = sys.stdin.buffer.readline(); payload = json.loads(raw); assert payload["seq"] == 0; assert len(raw) <= 512 * 1024 + 1'

      - name: Rebuild ARM64 twice and compare with the bundled ELF
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-arm64.py --target-dir /tmp/omastats-arm64-a
          python scripts/build-arm64.py --target-dir /tmp/omastats-arm64-b
          cmp /tmp/omastats-arm64-a/aarch64-unknown-linux-musl/release/omastats-sampler /tmp/omastats-arm64-b/aarch64-unknown-linux-musl/release/omastats-sampler
          cmp /tmp/omastats-arm64-a/aarch64-unknown-linux-musl/release/omastats-sampler bin/omastats-sampler-aarch64
          sha256sum --check --strict bin/omastats-sampler-aarch64.sha256

      - name: Write the verification report
        shell: bash
        env:
          BUILDER_IMAGE: archlinux@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
        run: |
          set -euo pipefail
          {
            echo 'format=omastats-binary-provenance-v1'
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "builder_image=$BUILDER_IMAGE"
            echo "rustflags=$RUSTFLAGS"
            echo "cargo_lock_sha256=$(sha256sum sampler/Cargo.lock | cut -d' ' -f1)"
            echo "binary_sha256=$(sha256sum bin/omastats-sampler | cut -d' ' -f1)"
            echo "arm64_binary_sha256=$(sha256sum bin/omastats-sampler-aarch64 | cut -d' ' -f1)"
            echo 'arm64_target=aarch64-unknown-linux-musl'
            echo "arm64_builder_sha256=$(sha256sum scripts/build-arm64.py | cut -d' ' -f1)"
            .cache/arm64-toolchain/toolchain/bin/rustc --version --verbose
            echo 'verified_reproducible_builds=2'
            echo 'verified_bundled_binary=true'
            pacman -Q rust gcc gcc-libs binutils glibc git python
            rustc --version --verbose
          } > binary-provenance.txt

      - name: Sign GitHub artifact attestations
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            bin/omastats-sampler
            bin/omastats-sampler-aarch64
            binary-provenance.txt

      - name: Upload the verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-provenance-${{ steps.source.outputs.commit }}
          path: binary-provenance.txt
          if-no-files-found: error
          retention-days: 90

  arm64-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test scripts/test-model.cjs
      - name: Test the bundled binary on native ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sha256sum --check --strict bin/omastats-sampler-aarch64.sha256
          python3 scripts/test-launcher.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          process = subprocess.Popen(
              ["/usr/bin/python3", "-I", "sampler.py", "--interval", "0.1"],
              env={"LANG": "C.UTF-8", "LC_ALL": "C.UTF-8"},
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          try:
              for seq in range(3):
                  record = process.stdout.readline()
                  assert len(record) <= 512 * 1024 + 1
                  assert json.loads(record)["seq"] == seq
              assert Path(f"/proc/{process.pid}/exe").resolve() == Path("bin/omastats-sampler-aarch64").resolve()
              process.stdin.write(b"quit\n")
              process.stdin.flush()
              process.wait(timeout=5)
              assert process.returncode == 0
              assert process.stderr.read() == b""
          finally:
              if process.poll() is None:
                  process.kill()
                  process.wait()
          PY
